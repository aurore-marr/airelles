<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Horizon Planning — Maintenance</title>
  <style>
    :root {
      --bleu: #1e6f8e;
      --bleu-fonce: #134a5f;
      --accent: #4db6ac;
      --fond: #f4f8fa;
      --texte: #2b3a40;
      --gris: #6b7c84;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, var(--fond) 0%, #e3eef2 100%);
      color: var(--texte);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .carte {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(19, 74, 95, 0.12);
      max-width: 520px;
      width: 100%;
      padding: 48px 40px;
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, var(--bleu) 0%, var(--accent) 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo svg { width: 36px; height: 36px; }
    .marque {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--bleu);
      font-weight: 600;
      margin-bottom: 28px;
    }
    h1 {
      font-size: 26px;
      color: var(--bleu-fonce);
      margin-bottom: 16px;
      line-height: 1.3;
    }
    p {
      font-size: 16px;
      color: var(--gris);
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(77, 182, 172, 0.12);
      color: var(--bleu-fonce);
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 100px;
      margin-top: 24px;
    }
    .point {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }
    .contact {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #eef3f5;
      font-size: 14px;
      color: var(--gris);
    }
    .contact a { color: var(--bleu); text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <div class="carte">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 14 L9 8 L13 12 L21 5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="21" cy="5" r="2" fill="white"/>
      </svg>
    </div>
    <div class="marque">Horizon Planning</div>
    <h1>Maintenance en cours</h1>
    <p>L'application est temporairement indisponible le temps d'une mise à jour.</p>
    <p>Merci de votre patience, nous serons de retour très bientôt.</p>
    <div class="badge">
      <span class="point"></span>
      Mise à jour en cours
    </div>
    <div class="contact">
      Une question ? <a href="mailto:contact@horizon-planning.fr">contact@horizon-planning.fr</a>
    </div>
  </div>
</body>
</html>
